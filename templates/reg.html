<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Registration</title></head>
<body>
<h2>Registration Form</h2>
{% if error %}<p id="error" role="alert">{{ error }}</p>{% endif %}
<form action="/submit" method="post">
<label>Name: <input id="name" name="name" required></label><br>
<label>Email: <input id="email" name="email" type="email"></label><br>
<label>Password: <input id="password" name="password" type="password" required></label><br>
<button type="submit">Register</button>
</form></body></html>
